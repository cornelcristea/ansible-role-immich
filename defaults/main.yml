---
# defaults file for immich

# path for persisting data
immich_data_dir: "{{ immich_host_dir }}/data"

# database storage type (SSD or HDD)
immich_db_storage_type: SSD

# enable machine learning features (face detection, etc.)
immich_ml_enabled: true

# enable hardware acceleration for machine learning features
# https://docs.immich.app/features/ml-hardware-acceleration
immich_ml_hw_accel_enabled: true

# hardware acceleration service to use for machine learning features
# options: armnn, cuda, rocm, openvino, openvino-wsl
immich_ml_hw_accel_service: cpu

# docker image version for machine learning features
# for hardware acceleration, add one of -armnn/cuda/rocm/openvino/rknn to the image tag.
# immich_ml_version: release-cuda
immich_ml_version: release

# web interface port
immich_port: 2283

# database name
immich_postgres_db: immich_db

# database password
immich_postgres_password: dbpass

# database username
immich_postgres_username: dbuser

# postgres version (pgvector extension needed)
immich_postgres_version: 15-vectorchord0.5.3-pgvector0.8.1

# timezone for application
immich_timezone: Etc/UTC

# valkey version (redis-compatible)
immich_valkey_version: 9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9

# version of docker image
immich_version: release
